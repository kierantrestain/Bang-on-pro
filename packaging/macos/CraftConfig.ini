#
# KDE CraftMaster configuration for Bang On Pro on Apple Silicon (macOS arm64, Qt 6 / KF6).
# Modeled on KDE's official craft-ci/qt6/CraftConfig.ini for target `macos-arm-clang`.
#
# Usage:
#   python3 "${CRAFTMASTER_DIR}/CraftMaster.py" \
#     --config packaging/macos/CraftConfig.ini \
#     --variables "Root=${CRAFT_ROOT}" \
#     --targets macos-arm-clang \
#     --setup

[General]
Branch = master
ShallowClone = True
CraftUrl = https://invent.kde.org/packaging/craft.git

[Variables]
UseCache = True
CreateCache = False

[GeneralSettings]
General/KFHostToolingVersion = 6
Packager/RepositoryUrl = https://files.kde.org/craft/Qt6/
Packager/UseCache = True
Packager/CreateCache = False
Packager/DownloadDebugSymbolsCache = False
ContinuousIntegration/Enabled = True
ContinuousIntegration/OutputOnFailure = True
CodeSigning/Enabled = False

[BlueprintSettings]
libs/qt.qtMajorVersion = 6
libs/qt5.ignored = True
libs/qt6/qtdoc.ignored = True
/.buildTests = False

[macos-arm-clang]
General/ABI = macos-clang-arm64
Compile/BuildType = RelWithDebInfo
Packager/PackageType = MacDMGPackager
