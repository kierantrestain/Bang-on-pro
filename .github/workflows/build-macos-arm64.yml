name: Build macOS Apple Silicon (arm64)

on:
  push:
    branches:
      - main
      - "bangonpro/**"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version label (defaults to 0.1.0-alpha or git tag)"
        required: false
        default: "0.1.0-alpha"
      build_mode:
        description: "Dependency resolution mode (craft uses KDE Craft Qt6/KF6 cache)"
        required: false
        type: choice
        default: "craft"
        options:
          - craft
          - auto
          - homebrew

permissions:
  contents: read

concurrency:
  group: build-macos-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos-arm64:
    name: Build & Package BangOnPro-arm64.dmg (macos-14)
    runs-on: macos-14
    timeout-minutes: 90
    env:
      CRAFT_ROOT: ${{ github.workspace }}/CraftRoot
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify native Apple Silicon (arm64) runner
        run: |
          echo "OS: $(sw_vers -productVersion)"
          echo "Arch: $(uname -m)"
          test "$(uname -m)" = "arm64"
          xcode-select -p

      - name: Resolve release version
        id: version
        env:
          INPUT_RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VER="${GITHUB_REF_NAME#v}"
          elif [[ -n "${INPUT_RELEASE_VERSION:-}" ]]; then
            VER="${INPUT_RELEASE_VERSION}"
          else
            VER="0.1.0-alpha"
          fi
          echo "app_version=${VER}" >> "$GITHUB_OUTPUT"
          echo "Resolved Bang On Pro version: ${VER}"

      - name: Install Homebrew base build & packaging tools
        run: |
          brew install \
            cmake \
            ninja \
            ccache \
            pkg-config \
            create-dmg \
            ffmpeg \
            mlt \
            frei0r \
            qt@6 \
            python@3.12

      - name: Cache KDE Craft Qt6/KF6 Apple Silicon prefix
        id: craft-cache
        if: ${{ (inputs.build_mode || 'craft') != 'homebrew' }}
        uses: actions/cache@v4
        with:
          path: ${{ env.CRAFT_ROOT }}
          key: craft-qt6-macos14-arm64-${{ hashFiles('packaging/macos/craft_blueprint.py', 'CMakeLists.txt') }}
          restore-keys: |
            craft-qt6-macos14-arm64-

      - name: Bootstrap KDE Craft Qt6 + KF6 + MLT 7 + FFmpeg dependencies (arm64)
        if: ${{ (inputs.build_mode || 'craft') != 'homebrew' }}
        run: |
          if [[ ! -f "${CRAFT_ROOT}/craft/craftenv.sh" ]]; then
            curl -fsSL https://raw.githubusercontent.com/KDE/craft/master/setup/CraftBootstrap.py -o /tmp/CraftBootstrap.py
            python3 /tmp/CraftBootstrap.py \
              --prefix "${CRAFT_ROOT}" \
              --branch qt6 \
              --use-defaults
          fi

          # Overlay Bang On Pro KDE Craft blueprint
          BLUEPRINT_DIR="${CRAFT_ROOT}/etc/blueprints/locations/craft-blueprints-kde/kde/kdemultimedia/bangonpro"
          mkdir -p "${BLUEPRINT_DIR}"
          cp packaging/macos/craft_blueprint.py "${BLUEPRINT_DIR}/bangonpro.py"

          # Install prebuilt binary-cached Qt6/KF6/MLT/FFmpeg dependencies on arm64
          source "${CRAFT_ROOT}/craft/craftenv.sh"
          craft --no-cache --install-deps bangonpro || craft --install-deps kdenlive

      - name: Configure optional Developer ID signing & notarization
        id: signing
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          if [[ -n "${MACOS_CERTIFICATE_P12:-}" && -n "${MACOS_CERTIFICATE_PASSWORD:-}" && -n "${MACOS_SIGNING_IDENTITY:-}" ]]; then
            KEYCHAIN_PATH="${RUNNER_TEMP}/bangonpro-signing.keychain-db"
            KEYCHAIN_PASS="$(openssl rand -base64 24)"
            CERT_P12_PATH="${RUNNER_TEMP}/certificate.p12"

            printf '%s' "${MACOS_CERTIFICATE_P12}" | base64 --decode > "${CERT_P12_PATH}"
            security create-keychain -p "${KEYCHAIN_PASS}" "${KEYCHAIN_PATH}"
            security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
            security unlock-keychain -p "${KEYCHAIN_PASS}" "${KEYCHAIN_PATH}"
            security import "${CERT_P12_PATH}" \
              -P "${MACOS_CERTIFICATE_PASSWORD}" \
              -A -t cert -f pkcs12 \
              -k "${KEYCHAIN_PATH}"
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${KEYCHAIN_PASS}" "${KEYCHAIN_PATH}"
            security list-keychains -d user -s "${KEYCHAIN_PATH}" login.keychain-db
            rm -f "${CERT_P12_PATH}"

            echo "APPLE_SIGNING_IDENTITY=${MACOS_SIGNING_IDENTITY}" >> "$GITHUB_ENV"
            echo "SIGNING_KEYCHAIN_PATH=${KEYCHAIN_PATH}" >> "$GITHUB_ENV"
            echo "signing_configured=true" >> "$GITHUB_OUTPUT"

            if [[ -n "${MACOS_NOTARY_KEY:-}" && -n "${MACOS_NOTARY_KEY_ID:-}" && -n "${MACOS_NOTARY_ISSUER_ID:-}" ]]; then
              NOTARY_KEY_FILE="${RUNNER_TEMP}/AuthKey_${MACOS_NOTARY_KEY_ID}.p8"
              printf '%s' "${MACOS_NOTARY_KEY}" | base64 --decode > "${NOTARY_KEY_FILE}"
              chmod 600 "${NOTARY_KEY_FILE}"
              echo "MACOS_NOTARY_KEY_PATH=${NOTARY_KEY_FILE}" >> "$GITHUB_ENV"
              echo "MACOS_NOTARY_KEY_ID=${MACOS_NOTARY_KEY_ID}" >> "$GITHUB_ENV"
              echo "MACOS_NOTARY_ISSUER_ID=${MACOS_NOTARY_ISSUER_ID}" >> "$GITHUB_ENV"
              echo "notarization_configured=true" >> "$GITHUB_OUTPUT"
            else
              echo "notarization_configured=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "::notice title=Ad-Hoc Signing Fallback::MACOS_CERTIFICATE_P12 / MACOS_SIGNING_IDENTITY secrets are not configured. Building with ad-hoc signature (codesign --force --deep --sign -); artifact will NOT be notarized."
            echo "signing_configured=false" >> "$GITHUB_OUTPUT"
            echo "notarization_configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build, Sign, Package BangOnPro-arm64.dmg & Smoke-Test
        env:
          INPUT_BUILD_MODE: ${{ inputs.build_mode || 'craft' }}
          APP_VERSION: ${{ steps.version.outputs.app_version }}
        run: |
          chmod +x packaging/macos/build_macos_arm64.sh
          ./packaging/macos/build_macos_arm64.sh \
            --mode "${INPUT_BUILD_MODE}" \
            --craft-root "${CRAFT_ROOT}" \
            --version "${APP_VERSION}" \
            --output-dir dist/macos-arm64

      - name: Run Python QA & security checks on macOS arm64
        run: |
          python3 -m pip install --user -r requirements-bangonpro.txt PyYAML || true
          python3 -m pytest -v tests/bangonpro/test_security_and_compliance.py tests/bangonpro/test_project_integrity.py

      - name: Annotate artifact signing state in workflow summary
        if: always()
        run: |
          {
            echo "## Bang On Pro Apple Silicon (\`arm64\`) Build Summary"
            echo ""
            if [[ -f dist/macos-arm64/SIGNING_STATUS.txt ]]; then
              echo '```'
              cat dist/macos-arm64/SIGNING_STATUS.txt
              echo '```'
            else
              echo "> Build did not reach packaging/signing stage."
            fi
            echo ""
            if [[ -f dist/macos-arm64/SHA256SUMS.txt ]]; then
              echo "### SHA-256 Checksums"
              echo '```'
              cat dist/macos-arm64/SHA256SUMS.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up temporary signing keychain & notary key
        if: always()
        run: |
          if [[ -n "${SIGNING_KEYCHAIN_PATH:-}" && -f "${SIGNING_KEYCHAIN_PATH}" ]]; then
            security delete-keychain "${SIGNING_KEYCHAIN_PATH}" || true
          fi
          if [[ -n "${MACOS_NOTARY_KEY_PATH:-}" && -f "${MACOS_NOTARY_KEY_PATH}" ]]; then
            rm -f "${MACOS_NOTARY_KEY_PATH}"
          fi

      - name: Upload BangOnPro-arm64.dmg, checksums & verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BangOnPro-macos-arm64-${{ steps.version.outputs.app_version }}
          path: |
            dist/macos-arm64/*.dmg
            dist/macos-arm64/SHA256SUMS.txt
            dist/macos-arm64/SIGNING_STATUS.txt
            dist/macos-arm64/BUILD_VERIFICATION.log
          retention-days: 30
          if-no-files-found: warn

  publish-release:
    name: Attach arm64 DMG to GitHub Release (Tags Only)
    needs: build-macos-arm64
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download macOS arm64 build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: BangOnPro-macos-arm64-*
          merge-multiple: true
          path: release-assets

      - name: Create / update GitHub Release with explicit signing notice
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          body: |
            ### Apple Silicon (`arm64`) macOS Installer

            Verify download integrity before installation:
            ```bash
            shasum -a 256 -c SHA256SUMS.txt
            ```

            Inspect `SIGNING_STATUS.txt` attached to this release to verify whether this build is **Developer ID signed & notarized** or **ad-hoc signed** (see `docs/MACOS_BUILD_AND_INSTALL.md` for Gatekeeper instructions).
          files: |
            release-assets/*.dmg
            release-assets/SHA256SUMS.txt
            release-assets/SIGNING_STATUS.txt
            release-assets/BUILD_VERIFICATION.log
